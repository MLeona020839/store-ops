name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # `build` runs ktlintCheck and all tests. The runner has Docker,
      # so the Testcontainers integration tests run here even if they skip locally.
      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  # Builds both Docker images, starts the whole system with docker compose and runs the
  # full flow over HTTP. Only after the tests pass: no point in packaging a failing build.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build images and start the system
        run: docker compose --profile apps up -d --build

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Show logs
        if: failure()
        run: docker compose --profile apps logs --no-color

      - name: Stop the system
        if: always()
        run: docker compose --profile apps down --volumes
