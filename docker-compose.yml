# Local environment.
#   docker compose up -d                     PostgreSQL + Kafka; run the services with Gradle or the IDE
#   docker compose --profile apps up -d --build   ...and both services as containers, the whole system
#                                            (run scripts/dev-jwt.sh keys first: the services need its public key)
# Image versions match the Testcontainers setup in each service's tests.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: storeops
      POSTGRES_PASSWORD: storeops # local development only
    ports:
      - "5432:5432"
    volumes:
      # One database per service: services never read each other's tables.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeops"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Single-node KRaft broker (no ZooKeeper) with two listeners, because clients reach it
    # under two names: services on the host use localhost:9092, containers use kafka:19092.
    # A broker can only hand out the address of the listener the client connected to.
    image: apache/kafka:4.3.2
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: UNPIa48YSoueHwoxn8hIeQ # any base64-encoded UUID; identifies this local cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # Single broker, so internal topics can't have more than one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # If store-task-service subscribes before promotion-service has created promotion-events,
      # the topic is auto-created: with as many partitions as promotion-service would give it.
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  promotion-service:
    profiles: [apps]
    build:
      context: .
      args:
        SERVICE: promotion-service
    image: store-ops/promotion-service:local
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/promotions
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # Trust tokens from scripts/dev-jwt.sh. Only the public key is mounted, never the private one.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLICKEYLOCATION: file:/keys/jwt-public.pem
    volumes:
      - ./.dev-keys/jwt-public.pem:/keys/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  store-task-service:
    profiles: [apps]
    build:
      context: .
      args:
        SERVICE: store-task-service
    image: store-ops/store-task-service:local
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/store_tasks
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # Trust tokens from scripts/dev-jwt.sh. Only the public key is mounted, never the private one.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLICKEYLOCATION: file:/keys/jwt-public.pem
    volumes:
      - ./.dev-keys/jwt-public.pem:/keys/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
