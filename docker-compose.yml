# Local infrastructure for development: `docker compose up -d`, then run the services with Gradle.
# Image versions match the Testcontainers setup in each service's tests.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: storeops
      POSTGRES_PASSWORD: storeops # local development only
    ports:
      - "5432:5432"
    volumes:
      # One database per service: services never read each other's tables.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeops"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Single-node KRaft broker (no ZooKeeper). Without extra config the image
    # advertises localhost:9092, which is what services running on the host need.
    image: apache/kafka:4.3.2
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:
