spring.application.name=promotion-service
server.port=8081

# Local development defaults, matching docker-compose.yml. Override with environment
# variables in any real environment (e.g. SPRING_DATASOURCE_PASSWORD).
spring.datasource.url=jdbc:postgresql://localhost:5432/promotions
spring.datasource.username=storeops
spring.datasource.password=storeops

spring.kafka.bootstrap-servers=localhost:9092

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Errors as RFC 9457 problem details (application/problem+json)
spring.mvc.problemdetails.enabled=true
