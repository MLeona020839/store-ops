spring.application.name=promotion-service
server.port=8081

# Local development defaults, matching docker-compose.yml. Override with environment
# variables in any real environment (e.g. SPRING_DATASOURCE_PASSWORD).
spring.datasource.url=jdbc:postgresql://localhost:5432/promotions
spring.datasource.username=storeops
spring.datasource.password=storeops

spring.kafka.bootstrap-servers=localhost:9092

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Errors as RFC 9457 problem details (application/problem+json)
spring.mvc.problemdetails.enabled=true

# Kafka producer: wait for all in-sync replicas and let the broker drop duplicate retries.
# These are the client defaults since Kafka 3.0; set explicitly because the outbox relies on them.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Outbox relay (see OutboxRelay)
outbox.relay.interval-ms=500
outbox.relay.batch-size=100
outbox.relay.send-timeout=10s

# Outbox cleanup (see OutboxCleanup): published rows older than the retention are deleted.
outbox.cleanup.retention=7d
outbox.cleanup.interval-ms=3600000
outbox.cleanup.batch-size=1000
