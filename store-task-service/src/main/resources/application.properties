spring.application.name=store-task-service
server.port=8082

# Local development defaults, matching docker-compose.yml. Override with environment
# variables in any real environment (e.g. SPRING_DATASOURCE_PASSWORD).
spring.datasource.url=jdbc:postgresql://localhost:5432/store_tasks
spring.datasource.username=storeops
spring.datasource.password=storeops

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=store-task-service
spring.kafka.consumer.auto-offset-reset=earliest

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Up to three consumers, one per partition of promotion-events.
spring.kafka.listener.concurrency=3

# Retries before a message goes to promotion-events-dlt (see MessagingConfiguration)
messaging.retry.interval=1s
messaging.retry.attempts=3
